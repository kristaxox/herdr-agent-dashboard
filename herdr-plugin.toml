id = "kristaxox.agent-dashboard"
name = "Agent Dashboard"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Topology dashboard for Claude Code agents in Herdr: status, activity, model, branch, PR, CI and bead. Claude Code only. Click for details, double-click to jump."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "-c", "mkdir -p bin && go build -o bin/dashboard ./cmd/dashboard"]

[[panes]]
id = "dashboard"
title = "Agent Dashboard"
placement = "tab"
command = ["./bin/dashboard"]

[[actions]]
id = "open"
title = "Open agent dashboard"
contexts = ["global"]
command = ["sh", "-c", 'exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin kristaxox.agent-dashboard --entrypoint dashboard --focus']
